max_parallel = 2              # a sensible default; adjust
efforts = ["low", "medium", "high"]   # also xhigh, max, ultra; luna has no ultra
order_evidence = "confirmed for capability (Codex models documentation); cost order is an assumption"

[[codex.rung]]
name = "Astra"
ids = ["gpt-6-astra"]
delegate_as = "gpt-6-astra"   # value of spawn_agent `model`
evidence = "confirmed: `codex debug models`"

[[codex.rung]]
name = "Sol"
ids = ["gpt-6.1-sol"]
delegate_as = "gpt-6.1-sol"
evidence = "confirmed: `codex debug models`"

[[codex.rung]]
name = "Terra"
ids = ["gpt-6.1-terra"]
delegate_as = "gpt-6.1-terra"
evidence = "confirmed: `codex debug models`"

[[codex.rung]]
name = "Luna"
ids = ["gpt-6-luna"]
delegate_as = "gpt-6-luna"
