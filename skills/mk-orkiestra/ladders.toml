# EXAMPLE model ladders for the mk-orkiestra skill, checked on 2026-11-14.
# Model names and tiers change often and differ per account: verify these
# against your own harness's model list and edit them (see section 9 of
# SKILL.md). Rungs are listed from the top (most capable, most expensive) to
# the bottom. A boss delegates only to rungs below its own.
# "evidence" says how each fact was established when this file was written:
#   confirmed  = read from the harness itself or its official documentation
#   preference = ordering or pairing chosen by the author, not measured
#   assumption = not verified; treat with care
# No prices are recorded here. Cost order follows the ladder order and is an
# assumption unless stated otherwise.
version = 1
checked = "2026-11-14"

# ---------------------------------------------------------------- Claude ----
[claude]
harnesses = ["Claude Code", "Claude Desktop (Code tab)"]   # Cowork does not read personal skills
guide = "harness/claude.md"
chores = "haiku"   # rung for orientation, mechanical work and bundled chores
max_parallel = 4              # a sensible default; adjust
efforts = ["low", "medium", "high"]   # the tool also accepts xhigh and max
order_evidence = "preference (tier order); prices not checked"

[[claude.rung]]
name = "Fable / Mythos"
ids = ["claude-fable-5-2", "claude-mythos-5-2"]
delegate_as = "fable"         # value of the Agent tool's `model` parameter
evidence = "confirmed: session model ID and Agent tool schema"

[[claude.rung]]
name = "Opus"
ids = ["claude-opus-5-5"]
delegate_as = "opus"
evidence = "confirmed: Agent tool schema"

[[claude.rung]]
name = "Sonnet"
ids = ["claude-sonnet-5-5"]
delegate_as = "sonnet"
evidence = "confirmed: Agent tool schema"

[[claude.rung]]
name = "Haiku"
ids = ["claude-haiku-5-5"]
delegate_as = "haiku"
evidence = "confirmed: Agent tool schema"

# ----------------------------------------------------------------- Codex ----
[codex]
harnesses = ["Codex CLI", "Codex Desktop"]
guide = "harness/codex.md"
