# EXAMPLE model ladders for the mk-orkiestra skill, checked on 2026-11-19.
# Model names, tiers and what a harness accepts change often and differ per
# account: verify these against your own harness's model list and edit them
# (see section 11 of SKILL.md). Rungs are listed from the top (most capable,
# most expensive) to the bottom. Work goes only to rungs below the boss; rungs
# above the boss may be consulted (SKILL.md section 3, the `up` tables below).
# "evidence" says how each fact was established when this file was written:
#   confirmed  = read from the harness itself or its official documentation
#   preference = ordering or pairing chosen by the author, not measured
#   assumption = not verified; treat with care
# Per rung: `judgement = true` means the rung may take judgement tasks as a
# subagent (security review, migration plan, hard debugging); `consent = true`
# means the user's yes is needed before the first upward call to that rung in
# a session (it can bill extra). `up.tested` records live tests as facts about
# the products, with the harness version; anything marked untested or
# unverified is exactly that. No prices are recorded here. Cost order follows
# the ladder order and is an assumption unless stated otherwise.
version = 2
checked = "2026-11-19"

# ---------------------------------------------------------------- Claude ----
[claude]
harnesses = ["Claude Code", "Claude Desktop (Code tab)"]   # Cowork does not read personal skills
guide = "harness/claude.md"
chores = "haiku"   # rung for orientation, mechanical work and bundled chores
max_parallel = 4              # a sensible default; adjust
efforts = ["low", "medium", "high"]   # the tool also accepts xhigh and max
order_evidence = "preference (tier order); prices not checked"

[claude.up]
advisor = "built-in advisor tool (enabled by the user: `/advisor <model>`, setting `advisorModel`, or `claude --advisor <model>`); otherwise Agent tool with the next rung up, effort high, question carrying its context"
expert = "Agent tool, `model` = next rung up, `effort: \"high\"`, prompt says read-only, report at most 40 lines; never subagent_type fork"
max_per_stage = 3
tested = "2026-11-19, Claude Code 2.1.328: confirmed. `claude -p --model sonnet --advisor opus` accepted; modelUsage shows claude-opus-5-5 tokens (about 72k in, 923 out: the advisor receives the whole conversation). Agent tool with model opus from a Sonnet session: modelUsage shows claude-opus-5-5 tokens (subagent_stats spawned 1). Not tested: Fable advisor (consent), desktop Code tab, /advisor in the desktop app."

# Mythos is for approved organisations and is never a delegation or
# consultation target.
[[claude.rung]]
name = "Fable / Mythos"
ids = ["claude-fable-5-2", "claude-mythos-5-2"]
delegate_as = "fable"         # value of the Agent tool's `model` parameter
judgement = true
consent = true                # when called upward: a Fable advisor or call can bill usage credits
evidence = "confirmed: session model ID and Agent tool schema; Fable advisor billing: code.claude.com/docs/en/advisor"

[[claude.rung]]
name = "Opus"
ids = ["claude-opus-5-5"]
delegate_as = "opus"
judgement = true
evidence = "confirmed: Agent tool schema"

[[claude.rung]]
name = "Sonnet"
ids = ["claude-sonnet-5-5"]
delegate_as = "sonnet"
judgement = true              # only at effort high; at lower effort treat as false
evidence = "confirmed: Agent tool schema; the effort-high condition is a recommended default"

[[claude.rung]]
name = "Haiku"
ids = ["claude-haiku-5-5"]
delegate_as = "haiku"
judgement = false
evidence = "confirmed: Agent tool schema"

# ----------------------------------------------------------------- Codex ----
[codex]
harnesses = ["Codex CLI", "Codex Desktop"]
guide = "harness/codex.md"
chores = "gpt-6-luna"   # rung for orientation, mechanical work and bundled chores
max_parallel = 2              # a sensible default; adjust
efforts = ["low", "medium", "high"]   # also xhigh, max, ultra; luna has no ultra
# Tier order Astra > Sol > Terra > Luna by price and OpenAI's own wording:
# confirmed (https://developers.openai.com/api/docs/pricing lists gpt-6.2-astra
# $8/$40, gpt-6.2-sol $2/$10, gpt-6.1-terra below Sol, gpt-6-luna cheapest;
# https://openai.com/index/introducing-gpt-6-sol-and-luna/ says Astra
# "continues to be our best model across the board").
# Capability of Sol versus Terra is NOT settled: third-party scores
# (benchlm.ai, 2026-11) put Terra close to or above Sol on some tests. The
# ladder follows cost and the author's tiering: assumption for capability.
# Within a tier the newer id replaces the older: confirmed as listing
# (gpt-6.2-* head `codex debug models` and the pricing page, 6.2 Astra is
# cheaper than 6 Astra); that 6.2 is more capable than 6.1 or 6: assumption.
# Models on one rung never delegate to each other.
order_evidence = "cost order confirmed (OpenAI pricing page); capability order Sol versus Terra assumption; 6.2 above 6.1 within a tier assumption"
# Codex 0.170.0 `codex features list`: `multi_agent` deprecated but on (V1
# fallback), `multi_agent_v2` stable and off; the guide's spawn_agent relies on
# the V1 path.

[codex.up]
advisor = "`spawn_agent` with a stronger `model`, `reasoning_effort: \"high\"`, `fork_turns: \"all\"` (it sees the conversation)"
expert = "`spawn_agent` with a stronger `model`, `reasoning_effort: \"high\"`, `fork_turns: \"none\"`, assignment says read-only; fallback `codex exec -m <id> -c model_reasoning_effort=high -s read-only --ephemeral \"<question>\"`"
max_per_stage = 3
tested = "2026-11-19, codex-cli 0.170.0: partly confirmed. From `codex exec -m gpt-6.1-terra` a spawn_agent call naming gpt-6.2-astra ran (a wait item appeared, the reply carried the requested ASTRA marker) but `exec --json` shows no spawn item and no per-subagent usage, so the subagent's model is not proven. Fallback `codex exec -m gpt-6.2-astra -c model_reasoning_effort=high -s read-only --ephemeral` confirmed (accepted, answered, usage reported). Not tested: fork_turns all, desktop app."

[[codex.rung]]
name = "Astra"
ids = ["gpt-6.2-astra", "gpt-6-astra"]
delegate_as = "gpt-6.2-astra"   # value of spawn_agent `model`
judgement = true
evidence = "confirmed: `codex debug models` 2026-11-19 (both ids listed); pricing page"

[[codex.rung]]
name = "Sol"
ids = ["gpt-6.2-sol", "gpt-6.1-sol", "gpt-6-sol"]
delegate_as = "gpt-6.2-sol"
judgement = true
evidence = "confirmed: `codex debug models` 2026-11-19 (all three listed); pricing page lists 6.2 and 6.1 at one price"

[[codex.rung]]
name = "Terra"
ids = ["gpt-6.1-terra"]
delegate_as = "gpt-6.1-terra"
judgement = false             # assumption: execution rung
evidence = "confirmed: `codex debug models` 2026-11-19, pricing page"

[[codex.rung]]
name = "Luna"
ids = ["gpt-6-luna"]
delegate_as = "gpt-6-luna"
judgement = false
evidence = "confirmed: `codex debug models` 2026-11-19, pricing page"

# ----------------------------------------------------------- Antigravity ----
[antigravity]
harnesses = ["Antigravity IDE", "Antigravity CLI (agy)"]
guide = "harness/antigravity.md"
chores = "flash"   # rung for orientation, mechanical work and bundled chores
max_parallel = 5              # a sensible default; adjust
efforts = ["low", "medium", "high"]   # part of the model ID, e.g. gemini-4-neon-high; Neon and Hydrogen also have xhigh
order_evidence = "confirmed: Google positions Neon between Hydrogen and Carbon (https://blog.google/innovation-and-ai/models-and-research/gemini-models/introducing-gemini-4-neon/: Carbon the hardest long-horizon work, Hydrogen fast everyday execution, Neon balances depth and efficiency; model card: Neon is adapted from Carbon); Argon versus Neon cost order and quota multipliers: assumption"
# On the account tested (agy 1.5.12, 2026-11-19) `agy models` listed:
# gemini-4-neon-xhigh/high/medium/low, gemini-4-argon-high/medium/low,
# gemini-4-hydrogen-xhigh/high/medium/low, gemini-3.8-flash-high/medium/low,
# claude-opus-5-5-low/medium/high, claude-sonnet-5-5-low/medium/high,
# gpt-oss-120b-medium, and the orchestrator models gemini-pro-orchestrator-neon
# ("Orchestrator (Neon)") and gemini-pro-orchestrator-g1-pro ("Orchestrator
# (Argon)"). No Carbon on that account (Cursor lists gemini-4-carbon-*). The
# list depends on the signed-in Google account; the boss runs `agy models` at
# the start of a session.
# A subagent's model is chosen by tier in an agent definition: `pro`, `flash`
# or `inherit`, not by model id. Tested 2026-11-19 (agy 1.5.12) with a
# Hydrogen-low boss (the transcript of each subagent records its model):
# `flash` resolved to gemini-4-hydrogen-tiered-high and `pro` to
# gemini-4-hydrogen-tiered-xhigh. So on the tested account `pro` was the same
# Hydrogen family at higher effort, not a stronger model; the mapping may
# depend on the account or on the boss's model: check what it resolves to on
# yours.
# Alternative topology: the built-in "Orchestrator (Neon)" / "Orchestrator
# (Argon)" models (strong planner, Hydrogen implementer). When you start in one
# of them, that built-in orchestration replaces this skill's delegation
# (untested).

[antigravity.up]
advisor = "a separate one-shot process on a stronger model: `agy --model gemini-4-neon-high --mode plan --output-format json -p=\"<question with context>\"` (the question must carry all context); the `mk-orkiestra-pro` helper only where `pro` resolves above the boss"
expert = "the same one-shot `agy --model <stronger id> --mode plan -p=\"...\"` with a read-only assignment; or `invoke_subagent` with role `mk-orkiestra-pro` when `pro` resolves above the boss"
max_per_stage = 3
tested = "2026-11-19, agy 1.5.12: `invoke_subagent` with the pro and flash helpers both ran (confirmed; resolved models read from the subagent transcripts: pro = gemini-4-hydrogen-tiered-xhigh, flash = gemini-4-hydrogen-tiered-high, boss gemini-4-hydrogen-low), so on the tested account the pro helper was NOT a stronger model; check yours. `agy --model gemini-4-neon-high --mode plan -p=...` confirmed (transcript model gemini-4-neon-high). Not tested: IDE, helper from a Neon boss."

[[antigravity.rung]]
name = "Gemini 4 Carbon / Argon"
ids = ["gemini-4-argon-high", "gemini-4-argon-medium", "gemini-4-argon-low"]   # Carbon ids (gemini-4-carbon-*) were not listed by `agy models` on the tested account
delegate_as = "pro"           # never needed: nothing sits above this rung here
judgement = true
evidence = "Argon confirmed by `agy models`; Carbon confirmed by `cursor-agent models` only; Carbon/Argon as one rung: assumption"

[[antigravity.rung]]
name = "Gemini 4 Neon"
ids = ["gemini-4-neon-xhigh", "gemini-4-neon-high", "gemini-4-neon-medium", "gemini-4-neon-low"]
delegate_as = "flash"         # a Neon boss delegates work to the Flash tier, agent `mk-orkiestra-flash`
judgement = true
evidence = "confirmed: `agy models`; position between Hydrogen and Carbon: Google blog and model card (see order_evidence)"

# One rung, two models. A session started on either works alone (and may
# consult upward); neither delegates to the other.
[[antigravity.rung]]
name = "Flash tier (Gemini 4 Hydrogen / Gemini 3.8 Flash)"
ids = ["gemini-4-hydrogen-xhigh", "gemini-4-hydrogen-high", "gemini-4-hydrogen-medium", "gemini-4-hydrogen-low", "gemini-3.8-flash-high", "gemini-3.8-flash-medium", "gemini-3.8-flash-low"]
delegate_as = "flash"         # agent `mk-orkiestra-flash`
judgement = false
evidence = "confirmed: `agy models` lists all seven ids; Hydrogen as successor of 3.8 Flash: reported, not verified; the flash tier resolved to gemini-4-hydrogen-tiered-high in the 2026-11-19 test"

# Antigravity also serves claude-opus-5-5-* and claude-sonnet-5-5-*. A session
# started on one of them may delegate to the `flash` tier only (assumption:
# the Flash tier costs less than either). Never delegate to `pro` from them.

# ---------------------------------------------------------------- Cursor ----
[cursor]
harnesses = ["Cursor IDE", "cursor-agent CLI"]
guide = "harness/cursor.md"
chores = "composer-2.5"   # rung for orientation, mechanical work and bundled chores
max_parallel = 2              # assumption; subagents share one checkout
efforts = ["low", "medium", "high"]   # part of the model ID, e.g. grok-4.7-medium
order_evidence = "preference (Grok 4.7 as boss, Composer 2.5 as subagent); relative cost is an assumption"
# Task `model` accepts only these slugs (error text of cursor-agent 2026.11.19-f005e9d):
task_model_slugs = ["claude-fable-5-2-high", "claude-opus-5-5-medium", "claude-sonnet-5-5-high", "composer-2.5", "composer-2.5-fast", "cursor-grok-4.6-high-fast", "gemini-4-carbon-medium", "gemini-4-neon-high", "gpt-5.6-sol-medium", "grok-4.7-high-fast", "muse-wonder-1.0-high"]

[cursor.up]
advisor = "helper `mk-orkiestra-advisor` (helpers/cursor/mk-orkiestra-advisor.md, `model: claude-opus-5-5-medium`, read-only); in cursor-agent use the Task tool with `model: \"claude-opus-5-5-medium\"`"
expert = "the same helper or Task `model`, assignment says read-only and report at most 40 lines; a Fable id needs the user's consent"
max_per_stage = 3
tested = "2026-11-19, cursor-agent 2026.11.19-f005e9d: Task `model: \"claude-opus-5-5-medium\"` from a composer-2.5 `--mode ask` session accepted; the subagent replied that it runs on Claude Opus 5.5 (self-report; the stream shows the slug was accepted, no usage per model). `claude-opus-5-5-high` was REFUSED (not in the allowed slugs). The custom helper name `mk-orkiestra-advisor` was NOT accepted as `subagent_type` in cursor-agent (fixed enum); the file is visible in ~/.cursor/agents. Not tested: IDE, custom subagent by name."

[[cursor.rung]]
name = "Grok 4.7"
ids = ["grok-4.7-xhigh", "grok-4.7-high", "grok-4.7-medium", "grok-4.7-low"]
delegate_as = "grok-4.7-medium"
judgement = true
evidence = "confirmed: `cursor-agent models` 2026-11-19"

[[cursor.rung]]
name = "Composer 2.5"
ids = ["composer-2.5"]
delegate_as = "composer-2.5"  # agent `mk-orkiestra-composer`; in cursor-agent also Task `model: "composer-2.5"`
judgement = false
evidence = "confirmed: `cursor-agent models` 2026-11-19"

# A Cursor session started on a Claude-family model follows the Claude ladder
# order (Fable, Opus, Sonnet) with Cursor's own ids, and Composer 2.5 as the
# chores rung (Cursor lists no Haiku). The same rules apply as for the Claude
# harness: work only down, questions up, consent for Fable. Task `model` takes
# only the slugs in `task_model_slugs`. Evidence: ids confirmed by
# `cursor-agent models` 2026-11-19; the ordering is the Claude tier order
# above (assumption that Cursor serves it unchanged).
[[cursor.claude_rung]]
name = "Fable"
ids = ["claude-fable-5-2-high", "claude-fable-5-2-medium", "claude-fable-5-2-xhigh"]   # (NO ZDR) in Cursor's list
delegate_as = "claude-fable-5-2-high"
judgement = true
consent = true
evidence = "ids confirmed: `cursor-agent models` 2026-11-19"

[[cursor.claude_rung]]
name = "Opus"
ids = ["claude-opus-5-5-medium", "claude-opus-5-5-high", "claude-opus-5-5-xhigh", "claude-opus-5-5-low"]
delegate_as = "claude-opus-5-5-medium"
judgement = true
evidence = "ids confirmed: `cursor-agent models` 2026-11-19; only the -medium slug is accepted by Task `model` (tested)"

[[cursor.claude_rung]]
name = "Sonnet"
ids = ["claude-sonnet-5-5-high", "claude-sonnet-5-5-medium", "claude-sonnet-5-5-low"]
delegate_as = "claude-sonnet-5-5-high"
judgement = true              # only at high effort
evidence = "ids confirmed: `cursor-agent models` 2026-11-19; -high accepted by Task `model` per the allowed list"

# `cursor-agent models` may also list gemini-4-neon-*, gemini-4-
# carbon-*, gemini-4-hydrogen-*, gemini-4-argon-*, gemini-3.8-flash-* and
# gpt-5.6-*. They are not on the ladder; relative cost is unknown; you
# decide. A Cursor session started on any other model (GPT, Gemini) has no
# rung here: it may delegate to Composer 2.5 only if you say so,
# otherwise it works alone (and may still consult upward).
