# ----------------------------------------------------------- Antigravity ----
[antigravity]
harnesses = ["Antigravity IDE", "Antigravity CLI (agy)"]
guide = "harness/antigravity.md"
chores = "flash"   # rung for orientation, mechanical work and bundled chores
max_parallel = 5              # a sensible default; adjust
efforts = ["low", "medium", "high"]   # part of the model ID, e.g. gemini-3.8-flash-low
order_evidence = "confirmed: Google positions Argon above 3.8 Flash; quota multipliers are unpublished"
# A subagent's model is chosen by tier in an agent definition: `pro`, `flash`
# or `inherit`. Delegation to a cheaper model therefore always means the
# `flash` tier, through the helper in helpers/antigravity/.
# The model list depends on the signed-in Google account. Some accounts offer
# both Gemini 4 Argon and Gemini 4 Hydrogen (successor of Gemini 3.8 Flash);
# others list only gemini-3.8-flash-high/medium/low plus a few non-Gemini
# models. The boss runs `agy models` at the
# start of a session and finds its own model in that list.
# The helper names the `flash` tier, so it runs on whichever model the
# signed-in account maps to `flash` (assumption, not verified live).

[[antigravity.rung]]
name = "Gemini 4 Argon"
ids = ["gemini-4-argon-high", "gemini-4-argon-medium", "gemini-4-argon-low"]
delegate_as = "pro"           # never needed: nothing sits above Argon here
evidence = "confirmed by `agy models`; offered only on some accounts"

# One rung, two models. A session started on either works alone; neither
# delegates to the other.
[[antigravity.rung]]
name = "Flash tier (Gemini 4 Hydrogen / Gemini 3.8 Flash)"
# Gemini 4 Hydrogen: successor of 3.8 Flash (reported, not verified).
# Its agy model IDs are not verified and are not recorded here: read them
# from `agy models`.
ids = ["gemini-3.8-flash-high", "gemini-3.8-flash-medium", "gemini-3.8-flash-low"]
delegate_as = "flash"         # agent `mk-orkiestra-flash`
evidence = "Gemini 3.8 Flash confirmed: `agy models`, `agy changelog`; Gemini 4 Hydrogen: reported, not verified"

# Antigravity may also serve Claude models. A session started on one of them may
# delegate to the `flash` tier only (assumption: the Flash tier costs less
# than either). Never delegate to `pro` from them.

# ---------------------------------------------------------------- Cursor ----
[cursor]
harnesses = ["Cursor IDE", "cursor-agent CLI"]
guide = "harness/cursor.md"
chores = "composer-2.5"   # rung for orientation, mechanical work and bundled chores
max_parallel = 2              # assumption; subagents share one checkout
efforts = ["low", "medium", "high"]   # part of the model ID, e.g. grok-4.7-medium
order_evidence = "preference (Grok 4.7 as boss, Composer 2.5 as subagent); relative cost is an assumption"

[[cursor.rung]]
name = "Grok 4.7"
ids = ["grok-4.7-xhigh", "grok-4.7-high", "grok-4.7-medium", "grok-4.7-low"]
delegate_as = "grok-4.7-medium"
evidence = "confirmed: `cursor-agent models`"

[[cursor.rung]]
name = "Composer 2.5"
ids = ["composer-2.5"]
delegate_as = "composer-2.5"  # agent `mk-orkiestra-composer`
evidence = "confirmed: `cursor-agent models`"

# `cursor-agent models` may also list gemini-4-hydrogen-low/medium/
# high/xhigh, gemini-4-carbon-*, gemini-4-argon-* and gemini-3.8-flash-*. They
# are not on the ladder; relative cost is unknown; you decide.

# A Cursor session started on another model (Claude, GPT) has no rung here:
# it may delegate to Composer 2.5 only if you say so, otherwise it
# works alone.
